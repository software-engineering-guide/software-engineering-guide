[project]
name = "software-engineering-guide"
version = "1.0.0"
description = "Software Engineering Guide: good practices for software developer teams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

# No site build lives in this repository (rendering moved to the separate
# software-engineering-guide.github.io repository), so there is nothing to
# package or install here beyond the dev tooling below.
[tool.uv]
package = false

# Spell checking (`just spell`, and the PR workflow). The ignore list holds
# false positives only: Oxford/British spellings the house style keeps
# (fulfilment), proper nouns (Skelton, Marz, Synopsys, ROUGE), real words the
# dictionary confuses (covert, bloc, wither, accreting, infarction,
# consequentially, SME), the bolded-first-letter SPACE expansion (erformance),
# and one deliberate typo used as an example of typo tolerance (reciept).
[tool.codespell]
skip = "./software-engineering-guide.github.io,./llms.json,./llms.txt,./site,./.venv,./node_modules,./uv.lock,./styles,./locales/cy-001,./locales/hi-001,./locales/zh-cn,./locales/zh-001,./locales/es-001,./locales/fr-001,./locales/de-de,./locales/de-001,./locales/ar-001,./locales/cy-gb,./locales/hi-in,./locales/bn-001,./locales/id-001,./locales/id-id,./locales/ja-jp,./locales/ja-001,./locales/ko-kr,./locales/ko-001,./locales/sv-se,./locales/sv-001,./locales/nl-nl,./locales/nl-001,./locales/is-is,./locales/is-001,./locales/pt-001,./locales/ru-001,./locales/ur-001,./locales/da-001,./locales/sw-001,./locales/sw-tz,./locales/vi-vn,./locales/vi-001,./locales/ar-eg,./locales/ar-dz,./locales/es-es,./locales/es-mx,./locales/fr-fr,./locales/fr-ca,./locales/ru-ru,./locales/ru-by,./locales/bn-bd,./locales/bn-in,./locales/id-my,./locales/pt-pt,./locales/pt-br,./locales/it-it,./locales/it-001,./locales/tr-tr,./locales/tr-001,./locales/zh-th,./locales/hi-np,./locales/cy-ar,./locales/de-at"
ignore-words-list = "fulfilment,skelton,erformance,accreting,infarction,reciept,synopsys,covert,consequentially,rouge,marz,bloc,wither,sme"

[dependency-groups]
dev = [
    "codespell[toml]>=2.4",
    "pre-commit>=4",
]
